[project]
name = "matplotlib"
description = "Python plotting package"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
# Build system
python = ">=3.11"
compilers = "*"
ninja = "*"
meson = "*"
meson-python = ">=0.13.1,!=0.17.*"
pybind11 = ">=2.13.2,!=2.13.3"
setuptools_scm = "*"
ccache = "*"
pip = "*"

# Runtime dependencies  
numpy = ">=1.25"
contourpy = ">=1.0.1"
cycler = ">=0.10"
fonttools = ">=4.22.0"
kiwisolver = ">=1.3.1"
pillow = ">=9"
pyparsing = ">=3"
python-dateutil = ">=2.7"
packaging = ">=20.0"

# Development tools
ipython = "*"

[tasks]
build = { cmd = "python -m pip install -e . --no-build-isolation -v", env = { CC = "ccache $CC", CXX = "ccache $CXX" } }
test-import = { cmd = "python -c \"import matplotlib; print('Build successful'); print('Version:', matplotlib.__version__)\"", depends-on = ["build"] }

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = { cmd = "python -m pytest", depends-on = ["build"] }

[feature.lint.dependencies]
ruff = "*"

[feature.lint.tasks]  
lint = "ruff check ."

[environments]
default = { features = ["test", "lint"] }
test = { features = ["test"] }
lint = { features = ["lint"] }